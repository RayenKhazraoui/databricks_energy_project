
resources:

  pipelines:
    silver_to_gold_pipeline:
      name: "silver_to_gold_pipeline"
      target: "gold"
      catalog: "data"
      libraries:
        - file:
            # Use your variable for consistent paths
            path: "${var.base_notebook_dir}/dlt_silver_to_gold/transformations/my_transformation.py"

      continuous: 'false'
      development: 'false'
      photon: 'true'
      channel: 'CURRENT'
      serverless: 'true'
      root_path: "${var.base_notebook_dir}/dlt_silver_to_gold"


  jobs:
    my_job:
      name: "my_job"
      max_concurrent_runs: 1

      tasks:
        - task_key: A16_ingestion
          environment_key: serverless_env
          notebook_task:
            notebook_path: "${var.base_notebook_dir}/Ingestion A16.ipynb"

        - task_key: A16_bronze_to_silver
          depends_on:
            - task_key: A16_ingestion
          environment_key: serverless_env
          notebook_task:
            notebook_path: "${var.base_notebook_dir}/Bronze_to_Silver_A16.ipynb"

        - task_key: A75_ingestion
          environment_key: serverless_env
          notebook_task:
            notebook_path: "${var.base_notebook_dir}/ingestion A75.ipynb"

        - task_key: A75_bronze_to_silver
          depends_on:
            - task_key: A75_ingestion
          environment_key: serverless_env
          notebook_task:
            notebook_path: "${var.base_notebook_dir}/Bronze_to_silver_A75.ipynb"

        - task_key: weather_ingestion
          environment_key: serverless_env
          notebook_task:
            notebook_path: "${var.base_notebook_dir}/Weather_data_ingestion.ipynb"

        - task_key: weather_silver
          depends_on:
            - task_key: weather_ingestion
          environment_key: serverless_env
          notebook_task:
            notebook_path: "${var.base_notebook_dir}/weather_bronze_to_silver.ipynb"

        - task_key: silver_to_gold
          depends_on:
            - task_key: A16_bronze_to_silver
            - task_key: A75_bronze_to_silver
            - task_key: weather_silver
          pipeline_task:
            # Correct interpolation + correct field name
            pipeline_id: ${resources.pipelines.silver_to_gold_pipeline.id}

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "4"
