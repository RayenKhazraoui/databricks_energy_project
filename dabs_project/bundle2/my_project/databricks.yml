# This is a Databricks asset bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_project
  uuid: a6ea241e-d5e3-4e3a-8fee-9cde0f812cf8

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405617936505874.14.azuredatabricks.net
    variables:
      catalog: data
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405617936505874.14.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/rayen@willeminebeuvinghotmail.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rayen@willeminebeuvinghotmail.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: data
      schema: prod
    permissions:
      - user_name: rayen@willeminebeuvinghotmail.onmicrosoft.com
        level: CAN_MANAGE
